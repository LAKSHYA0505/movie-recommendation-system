<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Recommender</title>
<style>
  body{font-family:system-ui,Segoe UI,Arial,sans-serif;margin:0;background:#f5f6fa;color:#222}
  header{background:#1f2a44;color:#fff;padding:18px 32px}
  header h1{margin:0;font-size:22px} header p{margin:4px 0 0;opacity:.8;font-size:14px}
  main{max-width:1100px;margin:24px auto;padding:0 16px}
  .controls{background:#fff;padding:16px;border-radius:10px;display:flex;gap:16px;flex-wrap:wrap;align-items:end;box-shadow:0 1px 3px #0001}
  label{font-size:13px;display:flex;flex-direction:column;gap:4px}
  input,select,button{padding:8px 10px;font-size:14px;border:1px solid #ccd;border-radius:6px}
  button{background:#3b5bdb;color:#fff;border:none;cursor:pointer} button:hover{background:#2f4ac0}
  .grid{display:grid;grid-template-columns:1fr 2fr;gap:20px;margin-top:20px}
  .card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px #0001}
  h2{font-size:16px;margin:0 0 10px}
  table{width:100%;border-collapse:collapse;font-size:13px} th,td{text-align:left;padding:6px;border-bottom:1px solid #eee}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#e7ecff}
  .stats{display:flex;gap:12px;margin-bottom:10px} .stat{background:#f1f3f9;border-radius:8px;padding:8px 12px;font-size:13px}
  .stat b{font-size:18px;display:block}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>🎬 Personalized Movie Recommender</h1>
<p>Collaborative filtering (User-based, Item-based, SVD) with diversity re-ranking</p></header>
<main>
  <div class="controls">
    <label>User ID <input id="uid" type="number" value="42" min="1"></label>
    <label>Model
      <select id="model">
        <option value="svd">SVD (matrix factorisation)</option>
        <option value="item">Item-based CF</option>
        <option value="user">User-based CF</option>
        <option value="baseline">Baseline (popularity/bias)</option>
      </select></label>
    <label>Diverse mode <select id="diverse"><option value="true">On (λ = 0.85)</option><option value="false">Off</option></select></label>
    <button onclick="go()">Get recommendations</button>
  </div>
  <div class="grid">
    <div class="card"><h2>What this user rated</h2><div id="history"></div></div>
    <div class="card"><h2>Top 10 recommendations</h2><div class="stats" id="stats"></div><div id="recs"></div></div>
  </div>
</main>
<script>
const tbl = (rows, cols) => rows.length ? `<table><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr>` +
  rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('') + '</table>' : '<p>No data.</p>';
async function go(){
  const u = document.getElementById('uid').value, m = document.getElementById('model').value,
        d = document.getElementById('diverse').value;
  const [h, r] = await Promise.all([
    fetch(`/api/history/${u}`).then(x=>x.json()),
    fetch(`/api/recommend/${u}?model=${m}&diverse=${d}`).then(x=>x.json())]);
  document.getElementById('history').innerHTML = tbl(h, [['Movie',x=>x.movie_title],['Language',x=>`<span class="tag">${x.language}</span>`],['★',x=>x.rating]]);
  if (r.error){ document.getElementById('recs').innerHTML = r.error; return; }
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${r.languages_in_list}</b>languages</div><div class="stat"><b>${r.genres_in_list}</b>genres</div>` +
    `<div class="stat"><b>${r.response_time_ms} ms</b>response time</div>` + (r.known_user ? '' : '<div class="stat">New user → popular picks</div>');
  document.getElementById('recs').innerHTML = tbl(r.recommendations, [['#',x=>r.recommendations.indexOf(x)+1],['Movie',x=>x.movie_title],
    ['Genre',x=>x.genre],['Language',x=>`<span class="tag">${x.language}</span>`],['Year',x=>x.release_year],['Predicted ★',x=>x.predicted_rating]]);
}
go();
</script>
</body>
</html>
